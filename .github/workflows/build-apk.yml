name: Build Diffequa APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore Persistent Android Signing Keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "CHYBA: Secret KEYSTORE_BASE64 je prazdny!"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/keystore"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > "$GITHUB_WORKSPACE/keystore/ondrandy.keystore"
          keytool -list -keystore "$GITHUB_WORKSPACE/keystore/ondrandy.keystore" -storepass android

      - name: Initialize Capacitor and build Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Diffequa" "cz.diffequa.game" --web-dir=www
          npx cap add android
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/g' android/app/src/main/AndroidManifest.xml

      - name: Configure Explicit Signing and versionCode in build.gradle
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/g" "$BUILD_GRADLE"
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/g" "$BUILD_GRADLE"
          cat << 'EOF' >> "$BUILD_GRADLE"
          android {
              signingConfigs {
                  debug {
                      storeFile file("${System.getenv('GITHUB_WORKSPACE')}/keystore/ondrandy.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF
          npx cap sync android

      - name: Generate App Icon (Impossible Card)
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          cat << 'EOF' > icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100">
            <rect width="100" height="100" rx="22" fill="#ffffff"/>
            <rect x="36" y="12" width="28" height="28" rx="2" fill="none" stroke="#eb8672" stroke-width="4.5"/>
            <circle cx="32" cy="68" r="15" fill="#8cc64d"/>
            <polygon points="68,52 84,82 52,82" fill="none" stroke="#e6c24f" stroke-width="4.5" stroke-linejoin="round"/>
          </svg>
          EOF
          rsvg-convert -w 512 -h 512 icon.svg -o icon.png
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$dir
            cp icon.png android/app/src/main/res/$dir/ic_launcher.png
            cp icon.png android/app/src/main/res/$dir/ic_launcher_round.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/diffequa.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: Diffequa-Android-APK
          path: android/app/build/outputs/apk/debug/diffequa.apk
